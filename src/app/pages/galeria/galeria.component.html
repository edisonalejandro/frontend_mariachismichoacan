<div class="page-hero">
  <div class="page-hero__inner">
    <span class="page-hero__tag">Momentos únicos</span>
    <h1>Nuestra <span>Galería</span></h1>
    <p>Revive algunos de los momentos más especiales que hemos vivido junto a nuestros clientes</p>
  </div>
</div>

<section class="section">
  <div class="container">

    <div class="filter-tabs">
      <button type="button" class="filter-tab" *ngFor="let c of categorias"
              [class.filter-tab--active]="categoriaActiva === c"
              [attr.aria-pressed]="categoriaActiva === c"
              (click)="setCategoria(c)">{{ c }}</button>
    </div>

    <div class="galeria-grid" *ngIf="filtrados.length > 0">
      <button type="button" class="galeria-item"
              *ngFor="let item of filtrados"
              [class.galeria-item--featured]="item.featured"
              [attr.aria-label]="'Ampliar foto: ' + item.titulo"
              (click)="openLightbox(item)">
        <img [src]="item.src"
             [attr.srcset]="srcsetDe(item.src)"
             [attr.sizes]="item.featured ? sizesFeatured : sizesNormal"
             alt="" loading="lazy" decoding="async" width="800" height="600" />
        <span class="galeria-item__overlay" aria-hidden="true">
          <span class="galeria-item__cat">{{ item.categoria }}</span>
          <span class="galeria-item__titulo">{{ item.titulo }}</span>
          <span class="galeria-item__zoom">🔍</span>
        </span>
      </button>
    </div>

    <div class="galeria-empty" *ngIf="filtrados.length === 0">
      <span>🎵</span>
      <p>No hay elementos en esta categoría aún</p>
    </div>

  </div>
</section>

<!-- Lightbox: <dialog> nativo (atrapa el foco, cierra con Esc y devuelve el foco a la foto) -->
<dialog #lightbox class="lightbox" aria-label="Foto ampliada"
        (click)="onLightboxClick($event)" (close)="onLightboxClosed()">
  <button type="button" class="lightbox__close" (click)="closeLightbox()" aria-label="Cerrar foto ampliada">✕</button>
  <img *ngIf="lightboxFoto" [src]="lightboxFoto.src" [alt]="lightboxFoto.titulo" />
</dialog>
